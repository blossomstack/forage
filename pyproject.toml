[project]
name = "forage"
version = "0.1.0"
description = "Fetch a URL, get clean Markdown. One small container, no browser."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
]

[project.scripts]
forage = "forage.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
