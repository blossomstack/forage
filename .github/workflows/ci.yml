name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is what the image
        # actually ships. A break at either end is a real break.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  image:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t forage:ci .

      - name: Run
        run: |
          docker run -d --name forage-ci -p 8080:8080 forage:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      - name: Extraction works end to end
        run: |
          # A real page, not a fixture: this is the check that catches a
          # dependency that imports fine but cannot parse anything.
          body=$(curl -sf 'http://localhost:8080/extract?url=https://example.com/')
          echo "$body"
          # Assert on the sentence example.com has kept through rewrites, plus a
          # length floor. An assertion on the exact wording is a test of someone
          # else's copy: the first version of this step pinned "illustrative
          # examples" and broke when they reworded the page.
          echo "$body" | grep -qi "this domain is for use"
          test "${#body}" -ge 50

      - name: The SSRF guard is on by default in the image
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:8080/extract?url=http://169.254.169.254/')
          test "$code" = "403"

      - name: MCP handshake and tool call over the mounted transport
        run: |
          pip install "mcp>=2.0"
          python - <<'EOF'
          import asyncio
          from mcp.client.session import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          async def main():
              async with streamable_http_client("http://localhost:8080/mcp/") as st:
                  async with ClientSession(st[0], st[1]) as s:
                      init = await s.initialize()
                      assert init.server_info.name == "forage", init.server_info
                      names = {t.name for t in (await s.list_tools()).tools}
                      # `search` must be absent: no FORAGE_SEARCH_URL is set here,
                      # and a tool that can only fail is worse than no tool.
                      assert names == {"fetch"}, names
                      ok = await s.call_tool("fetch", {"url": "https://example.com/"})
                      assert not ok.is_error, ok
                      assert "this domain is for use" in ok.content[0].text.lower()
                      bad = await s.call_tool("fetch", {"url": "http://169.254.169.254/"})
                      assert bad.is_error
                      # The reason has to survive: a masked crash message would
                      # leave a model unable to tell this from a transient failure.
                      assert "non-public address" in bad.content[0].text, bad.content[0].text
                      print("mcp ok:", names)

          asyncio.run(main())
          EOF

      - name: Container reports healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect forage-ci --format '{{.State.Health.Status}}')
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker logs forage-ci; exit 1; }
            sleep 2
          done
          docker logs forage-ci
          exit 1
